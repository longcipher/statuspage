    <link rel="stylesheet" href="/style/main.css">
    <!-- Early theme script: applies the saved/OS theme BEFORE the stylesheet
         finishes loading, so there's no flash of the wrong-theme background.
         Reads localStorage.theme (set by the ThemeToggle component) and falls
         back to prefers-color-scheme. Adds `.dark` to <html> when dark mode. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (t === 'dark' || (t === null && prefersDark)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { /* localStorage may be blocked; fall through to light */ }
        })();
    </script>
    <!-- Plotly.js runtime: required by the `plotly` crate's `to_inline_html`
         output, which calls the global `Plotly.newPlot(...)`. Served from the
         local `assets/` dir; copied to `/pkg/plotly.min.js` alongside the WASM
         bundle so no CDN dependency is needed. -->
    <script src="/pkg/plotly.min.js" charset="utf-8"></script>
<link rel="modulepreload" href="/status-frontend-3f7598bc31e87c29.js" crossorigin="anonymous" integrity="sha384-fHT1h2/qGspCQKghVV7vn0nMokNAv1bsci1PFTY+unmo6OiQIyVy7NmHcb+glnUb"><link rel="preload" href="/status-frontend-3f7598bc31e87c29_bg.wasm" crossorigin="anonymous" integrity="sha384-YenFy/ZMEy8D12LTmpHZnD5QGsfM/gj2a0U8Uyl3Gy2RbiLgmllAM5Fd2XobUcUd" as="fetch" type="application/wasm"></head>

    <script type="module">
        // `init` is the default export of the wasm-bindgen glue. It loads the
        // .wasm, instantiates it, and calls `__wbindgen_start()` which in turn
        // invokes the `#[wasm_bindgen(start)] fn main()` in lib.rs — so we do
        // NOT call main() explicitly here (double-mount breaks Leptos).
        //
        // Pass the options-object form (wasm-bindgen 0.2.100+ deprecates the
        // bare-string form). The explicit module_or_path keeps the bundle
        // discoverable regardless of the page's base URL.
        import init from '/pkg/status_frontend.js';
        async function run() {
            await init({ module_or_path: '/pkg/status_frontend_bg.wasm' });
        }
        run();
    </script>

<script type="module">
import init, * as bindings from '/status-frontend-3f7598bc31e87c29.js';
const wasm = await init({ module_or_path: '/status-frontend-3f7598bc31e87c29_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script><script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
</script></body>
</html>
