[package]
name = "status-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "status-server"
path = "src/main.rs"

[features]
default = []
# Enables the in-process agent probe implementations (dns, tls_cert,
# domain_expiry). The control plane build does not need these — the
# corresponding check kinds are rejected via `require_control_plane_support()`
# before reaching the probe code.
agent = ["dep:x509-parser", "dep:hickory-resolver"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
common = { path = "../../crates/common" }
dashmap = { workspace = true }
hex = { workspace = true }
hickory-resolver = { workspace = true, optional = true }
metrics = { workspace = true }
moka = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
statuscore = { path = "../../crates/core" }
storage = { path = "../../crates/storage" }
surge-ping = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true, optional = true }

[lints]
workspace = true
